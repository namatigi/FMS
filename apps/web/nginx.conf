server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Optional API reverse proxy when the web container fronts the stack.
  # Configure upstream hosts via the CORE_API / ANALYTICS hostnames in compose.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $core http://core-api:8080;
    proxy_pass $core;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # SSE stream
    proxy_read_timeout 1h;
  }
  location /analytics/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $analytics http://analytics:8090;
    proxy_pass $analytics;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
