# Local reverse proxy / load balancer for the compose stack.
# Requires nginx >= 1.27.3 (open-source "resolve" on upstream servers): every
# replica behind a compose service name (core-api, ingest-api, ...) is
# re-resolved through Docker's DNS every 10 s, so `--scale core-api=3` and
# container restarts are picked up without reloading nginx.
# Health checking is passive (max_fails/fail_timeout + proxy_next_upstream);
# Docker's own healthchecks gate start-up order. In Kubernetes, readiness
# probes remove unhealthy pods from the Service instead.

worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ua="$upstream_addr" '
                  'rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 1m;

  # Login brute-force protection and a general API limit per client IP.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=50r/s;
  limit_req_status 429;

  upstream core_api {
    zone core_api 64k;
    least_conn;
    server core-api:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  upstream ingest_api {
    zone ingest_api 64k;
    least_conn;
    server ingest-api:8081 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  upstream analytics {
    zone analytics 64k;
    server analytics:8090 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
  }
  upstream web {
    zone web 64k;
    server web:80 resolve max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Fail over to the next replica on connection errors / 502-504.
    # Only idempotent requests are retried by default; ingest writes are
    # idempotent by design, so non_idempotent is enabled there.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://core_api;
    }
    location /api/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://core_api;
    }

    # PTS-2 direct uploads and edge batches (store-and-forward bursts after a
    # WAN outage can be large).
    location /ingest/ {
      client_max_body_size 16m;
      proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
      proxy_read_timeout 120s;
      proxy_pass http://ingest_api;
    }

    location /analytics/ {
      limit_req zone=api burst=50 nodelay;
      proxy_read_timeout 120s;
      proxy_pass http://analytics;
    }

    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://web;
    }
  }
}
