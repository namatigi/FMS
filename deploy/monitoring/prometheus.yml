# Prometheus for the local compose stack (profile: observability).
# dns_sd_configs resolve every replica of a compose service, so each pod is
# scraped individually.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: core-api
    dns_sd_configs: [{ names: [core-api], type: A, port: 8080, refresh_interval: 15s }]
  - job_name: ingest-api
    dns_sd_configs: [{ names: [ingest-api], type: A, port: 8081, refresh_interval: 15s }]
  - job_name: fiscal-worker
    dns_sd_configs: [{ names: [fiscal-worker], type: A, port: 9464, refresh_interval: 15s }]
  - job_name: analytics
    dns_sd_configs: [{ names: [analytics], type: A, port: 8090, refresh_interval: 15s }]
  - job_name: edge-gateway
    # Assumption: the gateway serves /metrics on its UI/admin port (8101).
    static_configs: [{ targets: ["edge-gateway:8101"], labels: { station: LUS-0001 } }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"], labels: { cluster: fms-local } }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
