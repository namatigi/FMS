# keepalived VRRP for a primary/standby edge-gateway pair on the station LAN.
# The PTS-2 REMOTE SERVER SETTINGS point at the virtual IP (VIP), so when the
# primary mini-PC dies the standby takes the VIP within ~3 s and the PTS-2
# re-sends every record it has not had confirmed (SD-card buffer). Cloud
# ingest is idempotent, so records seen by both units are de-duplicated.
#
# Install on BOTH units:  apt-get install keepalived
#   /etc/keepalived/keepalived.conf   (this file; edit the marked lines)
#   /etc/keepalived/check_gateway.sh  (chmod 755)
# Both units: state BACKUP + nopreempt (no flapping back after recovery);
# priority 150 on the preferred unit, 100 on the standby.

global_defs {
  router_id FMS_GW_LUS_0001_A          # unique per unit (..._A / ..._B)
  enable_script_security
  script_user root
}

vrrp_script chk_gateway {
  script "/etc/keepalived/check_gateway.sh"
  interval 2
  timeout 2
  fall 3          # 3 failures (~6 s) -> drop priority
  rise 2
  weight -60      # 150 - 60 = 90 < standby's 100 -> standby takes over
}

vrrp_instance FMS_GW {
  state BACKUP                         # both units (required with nopreempt)
  interface eth0                       # forecourt LAN interface
  virtual_router_id 51                 # same on both units, unique on the LAN
  priority 150                         # 100 on the standby unit
  advert_int 1
  nopreempt
  unicast_src_ip 192.168.10.11         # this unit
  unicast_peer {
    192.168.10.12                      # the other unit
  }
  authentication {
    auth_type PASS
    auth_pass fmsLUS01                 # max 8 chars; per-station value
  }
  virtual_ipaddress {
    192.168.10.10/24 dev eth0 label eth0:vip   # PTS-2 remote server URI host
  }
  track_script {
    chk_gateway
  }
  # Only the VIP holder receives PTS-2 uploads, so only it fiscalises and
  # prints new sales. Record the state for the local UI / support staff.
  notify "/etc/keepalived/notify.sh"
}
