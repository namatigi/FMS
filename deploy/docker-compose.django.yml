# Run the cloud services on Django instead of the TypeScript implementations.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.django.yml up -d --build
#
# core-api, ingest-api and fiscal-worker keep their service names, ports,
# environment and database, so the proxy, web app, edge gateways and analytics
# are unchanged. All three run from one image (services/cloud) and differ only
# in FMS_SERVICE. Drop this file from the command to go back to the TypeScript
# services. mock-vsdc still comes from the fiscal-worker (node) image.

x-cloud-image: &cloud-image
  build: !override { context: ../services/cloud, dockerfile: Dockerfile }
  image: !override ${REGISTRY:-ghcr.io/oxoafrica/fms}/cloud:${TAG:-dev}

x-py-health: &py-health
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  core-api:
    <<: *cloud-image
    environment:
      FMS_SERVICE: core
      PORT: "8080"
    healthcheck:
      <<: *py-health
      test: !override ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]

  ingest-api:
    <<: *cloud-image
    environment:
      FMS_SERVICE: ingest
      PORT: "8081"
    healthcheck:
      <<: *py-health
      test: !override ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=3)"]

  fiscal-worker:
    <<: *cloud-image
    environment:
      FMS_SERVICE: worker
      METRICS_PORT: "9464"
    healthcheck:
      <<: *py-health
      test: !override ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9464/healthz', timeout=3)"]
