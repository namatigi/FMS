# Optional: scale on request rate / job backlog in addition to CPU.
# Requires prometheus-adapter exposing:
#   pods metric     http_requests_per_second   (from http_request_duration_seconds_count)
#   external metric fms_jobs_ready             (from cnpg_fms_jobs_count{status="queued"})
# Example adapter rules: adapter-rules.example.yaml (not applied by kustomize).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: HorizontalPodAutoscaler, name: "core-api|ingest-api" }
    patch: |-
      - op: add
        path: /spec/metrics/-
        value:
          type: Pods
          pods:
            metric: { name: http_requests_per_second }
            target: { type: AverageValue, averageValue: "150" }
  - target: { kind: HorizontalPodAutoscaler, name: fiscal-worker }
    patch: |-
      - op: add
        path: /spec/metrics/-
        value:
          type: External
          external:
            metric:
              name: fms_jobs_ready
              selector: { matchLabels: { kind: fiscalise } }
            target: { type: AverageValue, averageValue: "200" }
