# prometheus-adapter Helm values fragment (rules) backing the custom-metrics
# HPA component. Apply via the adapter's Helm release, not via kustomize.
rules:
  custom:
    - seriesQuery: 'http_request_duration_seconds_count{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: { resource: namespace }
          pod: { resource: pod }
      name:
        matches: "^http_request_duration_seconds_count$"
        as: "http_requests_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
  external:
    - seriesQuery: 'cnpg_fms_jobs_count{namespace!=""}'
      resources:
        overrides:
          namespace: { resource: namespace }
      name:
        matches: "^cnpg_fms_jobs_count$"
        as: "fms_jobs_ready"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>,status="queued"}) by (kind)'
