# Secrets come from the government vault via External Secrets Operator
# (external-secrets.io/v1). Nothing secret is committed to git.
# Replace the provider block with the real backend (HashiCorp Vault shown;
# AWS/GCP/Azure secret managers, or OpenBao, work the same way).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fms-vault
spec:
  provider:
    vault:
      server: https://vault.example.zm:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: fms
          serviceAccountRef:
            name: fms-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fms-external-secrets
---
# Application secrets: JWT signing key, field-level encryption key for
# controllers.hmac_secret (pgcrypto/KMS), webhook signing secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fms-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: fms-vault }
  target:
    name: fms-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: fms/app, property: jwt_secret }
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef: { key: fms/app, property: field_encryption_key }
    - secretKey: WEBHOOK_SIGNING_SECRET
      remoteRef: { key: fms/app, property: webhook_signing_secret }
---
# S3-compatible object storage credentials for Barman backups / WAL archive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fms-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: fms-vault }
  target:
    name: fms-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: fms/backup-s3, property: access_key_id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: fms/backup-s3, property: secret_access_key }
# The database application user (secret fms-pg-app: username/password/uri) is
# generated by CloudNativePG. To manage it from the vault instead, create an
# ExternalSecret of type kubernetes.io/basic-auth named fms-pg-app and set
# spec.bootstrap.initdb.secret.name on the Cluster.
