# Prometheus Operator scrape configs (kube-prometheus-stack in namespace
# "monitoring"; label release=kube-prometheus-stack matches its default selector).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fms-services
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [core-api, ingest-api, analytics] }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fms-fiscal-worker
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: fiscal-worker }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
# CNPG instances (built-in cnpg_* metrics + custom cnpg_fms_* queries).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fms-pg
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { cnpg.io/cluster: fms-pg, cnpg.io/podRole: instance }
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fms-pg-poolers
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchExpressions:
      - { key: cnpg.io/poolerName, operator: In, values: [fms-pg-pooler-rw, fms-pg-pooler-ro] }
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
