# Custom CloudNativePG monitoring queries (business metrics -> cnpg_fms_*).
# Source of truth: deploy/monitoring/postgres-exporter-queries.yaml (keep in sync).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fms-pg-monitoring
  labels:
    cnpg.io/reload: ""
data:
  queries: |
    fms_jobs:
      target_databases: ["fms"]
      primary: true
      query: |
        SELECT kind, status,
               count(*)::float8 AS count,
               COALESCE(EXTRACT(EPOCH FROM now() - min(run_at) FILTER (WHERE status = 'queued' AND run_at <= now())), 0)::float8 AS oldest_ready_seconds
        FROM fms.jobs
        WHERE status IN ('queued', 'running', 'dead')
        GROUP BY kind, status
      metrics:
        - kind:
            usage: "LABEL"
            description: "Job kind (fiscalise, webhook, rollup, erb_export, notify)"
        - status:
            usage: "LABEL"
            description: "Job status"
        - count:
            usage: "GAUGE"
            description: "Number of jobs in this state"
        - oldest_ready_seconds:
            usage: "GAUGE"
            description: "Age of the oldest queued job that is due"

    fms_fiscal:
      target_databases: ["fms"]
      primary: true
      query: |
        SELECT count(*) FILTER (WHERE fiscal_status = 'pending')::float8 AS pending,
               count(*) FILTER (WHERE fiscal_status = 'failed')::float8  AS failed,
               COALESCE(EXTRACT(EPOCH FROM now() - min(ended_at)), 0)::float8 AS oldest_unsigned_seconds
        FROM fms.pump_transactions
        WHERE fiscal_status IN ('pending', 'failed')
      metrics:
        - pending:
            usage: "GAUGE"
            description: "Pump transactions awaiting a ZRA signature"
        - failed:
            usage: "GAUGE"
            description: "Pump transactions whose fiscalisation failed"
        - oldest_unsigned_seconds:
            usage: "GAUGE"
            description: "Age of the oldest unsigned sale"

    fms_gateway:
      target_databases: ["fms"]
      primary: true
      query: |
        SELECT g.gateway_code, s.code AS station_code, s.province_id::text AS province_id,
               COALESCE(g.last_backlog, 0)::float8 AS backlog,
               COALESCE(EXTRACT(EPOCH FROM now() - g.last_seen_at), 1e9)::float8 AS seconds_since_seen
        FROM fms.edge_gateways g
        JOIN fms.stations s ON s.id = g.station_id
        WHERE s.status = 'active'
      metrics:
        - gateway_code:
            usage: "LABEL"
            description: "Edge gateway code"
        - station_code:
            usage: "LABEL"
            description: "Station code"
        - province_id:
            usage: "LABEL"
            description: "Province id"
        - backlog:
            usage: "GAUGE"
            description: "Unsent outbox records reported by the gateway's last heartbeat"
        - seconds_since_seen:
            usage: "GAUGE"
            description: "Seconds since the gateway's last heartbeat"

    fms_stations:
      target_databases: ["fms"]
      primary: true
      query: |
        SELECT h.connectivity, s.province_id::text AS province_id, count(*)::float8 AS count
        FROM fms.v_station_health h
        JOIN fms.stations s ON s.id = h.station_id
        WHERE s.status = 'active'
        GROUP BY h.connectivity, s.province_id
      metrics:
        - connectivity:
            usage: "LABEL"
            description: "online | degraded | offline"
        - province_id:
            usage: "LABEL"
            description: "Province id"
        - count:
            usage: "GAUGE"
            description: "Active stations by connectivity"
