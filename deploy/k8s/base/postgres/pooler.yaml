# PgBouncer in front of the cluster. rw -> primary, ro -> standbys.
# Transaction pooling: apps must not rely on session state (SET, advisory
# session locks, LISTEN/NOTIFY, named prepared statements across txns).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: fms-pg-pooler-rw
spec:
  cluster: { name: fms-pg }
  instances: 3
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "4000"
      default_pool_size: "60"
      reserve_pool_size: "10"
      server_idle_timeout: "300"
      query_wait_timeout: "30"
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: fms }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { cnpg.io/poolerName: fms-pg-pooler-rw }
      containers: []
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: fms-pg-pooler-ro
spec:
  cluster: { name: fms-pg }
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "2000"
      default_pool_size: "40"
      query_wait_timeout: "60"
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: fms }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { cnpg.io/poolerName: fms-pg-pooler-ro }
      containers: []
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fms-pg-pooler-rw
spec:
  minAvailable: 2
  selector:
    matchLabels: { cnpg.io/poolerName: fms-pg-pooler-rw }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fms-pg-pooler-ro
spec:
  minAvailable: 1
  selector:
    matchLabels: { cnpg.io/poolerName: fms-pg-pooler-ro }
