# ingest-api: PTS-2 direct uploads (jsonPTS) and edge-gateway batches. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  labels: &labels
    app.kubernetes.io/name: ingest-api
    app.kubernetes.io/part-of: fms
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-api
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: fms-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ingest-api }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ingest-api }
      containers:
        - name: ingest-api
          image: fms/ingest-api
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: fms-config }
          env:
            - name: PORT
              value: "8081"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: fms-pg-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: fms-pg-app, key: password } }
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST_RW):5432/$(DB_NAME)?sslmode=require
            - name: DATABASE_URL_RO
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST_RO):5432/$(DB_NAME)?sslmode=require
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: fms-app-secrets, key: JWT_SECRET } }
            - name: FIELD_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: fms-app-secrets, key: FIELD_ENCRYPTION_KEY, optional: true } }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            # Let the ingress controller drop the endpoint before SIGTERM.
            preStop: { sleep: { seconds: 5 } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  labels:
    app.kubernetes.io/name: ingest-api
    app.kubernetes.io/part-of: fms
spec:
  selector:
    app.kubernetes.io/name: ingest-api
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest-api
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: ingest-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingest-api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Percent, value: 100, periodSeconds: 60 }]
