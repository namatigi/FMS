# fiscal-worker: job workers (fiscalise, webhook, rollup, erb_export, notify) using FOR UPDATE SKIP LOCKED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiscal-worker
  labels: &labels
    app.kubernetes.io/name: fiscal-worker
    app.kubernetes.io/part-of: fms
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: fiscal-worker
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: fms-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { app.kubernetes.io/name: fiscal-worker }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: fiscal-worker }
      containers:
        - name: fiscal-worker
          image: fms/cloud   # Django (services/cloud); FMS_SERVICE picks the role
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: fms-config }
          env:
            - name: FMS_SERVICE
              value: worker
            - name: PORT
              value: "9464"
            - name: METRICS_PORT
              value: "9464"
            - name: EXPORT_DIR   # ERB daily returns; the root filesystem is read-only
              value: /var/lib/fms/exports
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: fms-pg-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: fms-pg-app, key: password } }
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST_RW):5432/$(DB_NAME)?sslmode=require
            - name: DATABASE_URL_RO
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST_RO):5432/$(DB_NAME)?sslmode=require
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: fms-app-secrets, key: JWT_SECRET } }
            - name: FIELD_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: fms-app-secrets, key: FIELD_ENCRYPTION_KEY, optional: true } }
            - name: WEBHOOK_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: fms-app-secrets, key: WEBHOOK_SIGNING_SECRET, optional: true } }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: exports, mountPath: /var/lib/fms/exports }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: exports
          persistentVolumeClaim: { claimName: fms-exports }
---
apiVersion: v1
kind: Service
metadata:
  name: fiscal-worker
  labels:
    app.kubernetes.io/name: fiscal-worker
    app.kubernetes.io/part-of: fms
spec:
  selector:
    app.kubernetes.io/name: fiscal-worker
  ports:
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fiscal-worker
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: fiscal-worker }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiscal-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: fiscal-worker }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Percent, value: 100, periodSeconds: 60 }]
