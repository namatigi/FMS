apiVersion: v1
kind: ConfigMap
metadata:
  name: fms-config
data:
  LOG_LEVEL: info
  NODE_ENV: production
  TZ: Africa/Lusaka
  # ZRA Smart Invoice VSDC used by fiscal-worker for direct-mode stations
  # (cloud fallback). Overridden per overlay.
  ZRA_VSDC_URL: https://vsdc.example.zra.org.zm
  ZRA_TPIN: "0000000000"
  ZRA_BHF_ID: "000"
  ZRA_DEVICE_SERIAL: FMS-CLOUD-0001
  # PgBouncer service names created by the CloudNativePG Poolers.
  DB_HOST_RW: fms-pg-pooler-rw
  DB_HOST_RO: fms-pg-pooler-ro
  DB_NAME: fms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fms-app
automountServiceAccountToken: false
