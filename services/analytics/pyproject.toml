[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fms-analytics"
version = "0.1.0"
description = "FMS analytics service: demand forecasting, stock-out prediction, national reserve, anomalies, price simulation and custom AI model registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "statsmodels>=0.14,<0.15",
    "scikit-learn>=1.5,<2",
    "PyJWT>=2.9,<3",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["fms_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM300"]
