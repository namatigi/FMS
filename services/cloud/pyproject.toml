[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fms-cloud"
version = "0.1.0"
description = "FMS cloud services on Django: core API (owner, regulator, admin, partner), ingest API (PTS-2 and edge gateways) and the fiscal/background worker"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "django-ninja>=1.3,<2",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "prometheus-client>=0.20,<1",
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["fms_cloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"
